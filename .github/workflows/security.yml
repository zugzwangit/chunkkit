name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e '.[dev]' pip-audit cyclonedx-bom
      - run: pip-audit
      - run: cyclonedx-py environment --output-file sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: sbom.json
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-results.sarif }
