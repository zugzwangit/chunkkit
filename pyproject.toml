[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chunkkit"
version = "0.1.0"
description = "Framework-neutral, model-aware chunking pipelines for RAG and LLM applications"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ChunkKit contributors" }]
keywords = ["chunking", "rag", "llm", "retrieval", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.8,<3"]

[project.urls]
Homepage = "https://github.com/zugzwangit/chunkkit"
Documentation = "https://github.com/zugzwangit/chunkkit#readme"
Issues = "https://github.com/zugzwangit/chunkkit/issues"

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.7"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
documents = ["beautifulsoup4>=4.12", "pypdf>=5", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
code = ["tree-sitter>=0.23"]
eval = ["numpy>=2.0"]
atlassian = ["httpx>=0.27"]
microsoft = ["httpx>=0.27"]
google = ["httpx>=0.27"]
notion = ["httpx>=0.27"]
slack = ["httpx>=0.27"]
github = ["httpx>=0.27"]
servicenow = ["httpx>=0.27"]
zendesk = ["httpx>=0.27"]
qdrant = ["qdrant-client>=1.12"]
pgvector = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pgvector>=0.3"]
pinecone = ["pinecone>=5"]
openai = ["openai>=1.50", "tiktoken>=0.8"]
anthropic = ["anthropic>=0.39"]
gemini = ["google-genai>=1"]
huggingface = ["transformers>=4.45", "sentence-transformers>=3.2"]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.12"]
haystack = ["haystack-ai>=2.6"]
all = [
  "typer>=0.12", "rich>=13.7", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9",
  "beautifulsoup4>=4.12", "pypdf>=5", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0",
  "tree-sitter>=0.23", "numpy>=2.0", "httpx>=0.27", "qdrant-client>=1.12",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pgvector>=0.3", "pinecone>=5",
  "openai>=1.50", "tiktoken>=0.8", "anthropic>=0.39", "google-genai>=1",
  "transformers>=4.45", "sentence-transformers>=3.2", "langchain-core>=0.3",
  "llama-index-core>=0.12", "haystack-ai>=2.6"
]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "hypothesis>=6.115",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.7",
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.scripts]
chunkkit = "chunkkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chunkkit"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "haystack.*",
  "langchain_core.*",
  "llama_index.*",
  "pinecone.*",
  "pypdf.*",
  "qdrant_client.*",
  "sqlalchemy.*",
  "tiktoken.*",
  "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["chunkkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
